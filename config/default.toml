# EH Sistemi varsayılan yapılandırması
# Tüm değerler MockSDR ve gerçek LimeSDR için ortak başlangıç noktasıdır.

[sdr]
# Varsayılan merkez frekansı (Hz) — 433 MHz ISM bandı
frequency = 433.0e6
# Örnekleme hızı (Hz)
sample_rate = 10.0e6
# RX kazancı (dB)
gain = 30.0
# Aktif RX kanalı
channel = 0
# Okuma başına örnek sayısı (FFT boyutuna göre worker ayarlar)
read_size = 4096

[dsp]
# FFT boyutu (örnek)
fft_size = 1024
# Pencere tipi: "hann" | "blackman-harris"
window = "hann"
# CA-CFAR: her yandaki eğitim hücresi sayısı
cfar_num_train = 16
# CA-CFAR: her yandaki koruma (guard) hücresi sayısı
cfar_num_guard = 4
# CA-CFAR: yanlış alarm olasılığı üssü → Pfa = 10^(-cfar_pfa_exp)
cfar_pfa_exp = 4

[ui]
# Waterfall satır (zaman dilimi) sayısı
waterfall_rows = 200
# Spektrum güncelleme hedefi (FPS) — bilgilendirme amaçlı
target_fps = 30

[doa]
# İki anten arası mesafe (m). λ/2 aliasing sınırı: 433 MHz'de ≈ 0.346 m.
# d ≤ λ/2 olmalı; aksi halde faz sarması nedeniyle açı belirsizdir.
baseline_m = 0.15

[motor]
# Motor kontrolcüsü seri portu ve hızı (gerçek donanım için).
port = "/dev/ttyUSB0"
baudrate = 115200

[scan]
# Stop-and-measure tarama açı aralığı ve adımı (derece).
start_deg = 0.0
stop_deg = 180.0
step_deg = 10.0

[mock]
# MockSDR çift kanal (DF) ground-truth: kalibrasyon ve DoA testleri için.
# Donanımsal kanal uyumsuzluğu (kalibrasyonun ölçüp gidereceği):
df_sample_shift = 3
df_phase_offset_rad = 0.6
# Baskın kaynağın gerçek geliş açısı (derece) — DoA'nın geri çıkaracağı değer.
df_true_doa_deg = 25.0

[tx]
# TX (ET) donanım kazancı (dB) — gerçek LimeSDR TX path.
gain_db = 40.0

[limits]
# Yazılımsal TX güç üst limiti (dB) — ET karıştırma/aldatma gücü bunu AŞAMAZ.
# UI güç ayarı bu değerle sınırlanır; TXWorker çıkışı bu seviyede kırpılır.
tx_power_max_db = 0.0
