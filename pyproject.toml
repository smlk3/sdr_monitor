[project]
name = "eh-system"
version = "0.1.0"
description = "LimeSDR tabanlı Elektronik Harp sistemi kontrol ve analiz yazılımı"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "TEKNOFEST 2026 EH Takımı" }]

# Not: SoapySDR Python baglamasi PyPI'da pip ile kurulamaz; sistem paketi olarak
# gelir (apt: python3-soapysdr + limesuite). LimeSDR kullanmak icin sistemde
# kurulu olmali. MockSDR (--mock) icin gerekli degildir.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "sigmf>=1.2",
    "tomli-w>=1.0",
]

[project.scripts]
eh-system = "eh_system.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eh_system"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
